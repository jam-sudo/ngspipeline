repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - .prettierignore
    - .prettierignore
    - CODE_OF_CONDUCT.md
    - assets/nf-core-ngspipeline_logo_light.png
    - docs/images/nf-core-ngspipeline_logo_light.png
    - docs/images/nf-core-ngspipeline_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - docs/CONTRIBUTING.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
    - CODE_OF_CONDUCT.md
    - assets/nf-core-ngspipeline_logo_light.png
    - docs/images/nf-core-ngspipeline_logo_light.png
    - docs/images/nf-core-ngspipeline_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: jam-sudo
  name: ngspipeline
  description: "Perturb-seq raw-read pipeline: FASTQ -> GEX/guide count matrices ->
    per-cell guide assignment -> ALIVE-ready h5ad"
  author: Jae Min Yoon
  version: 0.1.0dev
  force: true
  outdir: .
  skip_features:
    - igenomes
    - codespaces
    - vscode
    - seqera_platform
    - rocrate
    - email
  is_nfcore: false
